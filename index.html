const LINES=["ปี พ.ศ. 2529 (ค.ศ. 1986) - อีซีคาตี เอซีเล เริ่มไปสมัครทหาร", "ปี พ.ศ. 2531 (ค.ศ. 1988) - อีซีคาตี เอซีเล เข้าร่วมหน่วยรบพิเศษ Recces", "ปี พ.ศ. 2536 (ค.ศ. 1993) - กองกำลัง UN เข้าแทรกแซงสงครามซูดาน อีซีคาตี เอซีเล ทรยศฆ่าเพื่อนในหน่วยแล้วหนีข้ามประเทศไป", "ปี พ.ศ. 2541 (ค.ศ. 1998) - อีซีคาตี เอซีเล กลายเป็นนักฆ่าชื่อดังที่โด่งดังในโลกนักฆ่า และเจอกับจอมพลวีรยุทธ์ จันทรา และมาเป็นลูกน้องให้จอมพลวีรยุทธ์ จันทรา", "ปี พ.ศ. 2543 (ค.ศ. 2000) - ในคืนวันนี้ อีซีคาตี เอซีเล ลงมือสังหารผู้ก่อการร้ายนับร้อยที่มาโจมตีค่ายด้วยตัวคนเดียว และได้ฉายาว่า Shadow จากการพลางตัวในความมืดเป็นดังเงา", "22 พฤษภาคม พ.ศ. 2557 (ค.ศ. 2014) - ประเทศไทยเกิดการรัฐประหารที่นำโดยจอมพลวีรยุทธ์ จันทรา เขายึดอำนาจและตั้งตนเป็นผู้นำเผด็จการ", "## กาลครั้งหนึ่งในหัวใจ (กำเนิด PALMER46 ภาค 1)", "ปี พ.ศ. 2561 (ค.ศ. 2018) - ปาล์มมีรักแรก และโดนทิ้งจากรักแรก ปาล์มจึงเริ่มพยายามพัฒนาตัวเอง", "ปี พ.ศ. 2564 (ค.ศ. 2021) - ปาล์มที่เริ่มรู้สึกว่าตัวเองดีขึ้นไปขอแฟนเก่ามาคบอีกครั้ง แต่กลับได้รู้ความจริงว่าที่เธอคนนั้นเข้ามาหา เธอไม่ได้รักปาล์มเลย เธอแค่เข้ามาแกล้งรักเพราะพนันกับเพื่อนไว้", "ปี พ.ศ. 2565 (ค.ศ. 2022) - ปาล์มเดินทางไปเรียนต่อมหาลัยในกรุงเทพมหานคร ปาล์มที่กลายเป็นคนหมดความมั่นใจ ซึมเศร้า และไม่ชอบเข้าสังคม ปาล์มไม่ได้หาเพื่อนใหม่ในที่นั้น และเหงาโดดเดี่ยว ทำให้อาการซึมปาล์มยิ่งหนักกว่าเดิม", "ปี พ.ศ. 2566 (ค.ศ. 2023)", "24 มิถุนายน - ปาล์มบังเอิญเจออาย เธอเป็นผู้หญิงที่เข้ารุกปาล์มจนทั้งคู่เริ่มสนิทกัน และในเวลาไม่นานก็กลายเป็นแฟนกัน", "30 สิงหาคม - วันเกิดของปาล์ม อายซื้อชุดฮีโร่ในจิตรการของปาล์มให้ปาล์ม เสื้อฮูดสีน้ำเงินกับหน้ากากไฟ LED และตั้งชื่อฮีโร่ให้ปาล์ม ชื่อนั้นก็คือ PALMER46", "14 ตุลาคม - อายรู้ว่าตัวเองท้อง อายกลัวที่อนาคตตัวเองตังพังเพราะยังเรียนไม่จบ เลยเก็บตัวไม่ติดต่อกับปาล์ม ถึงแม้ปาล์มจะพยายามติดต่อไป", "16 ตุลาคม - อายที่เริ่มทำใจได้ไปหาปาล์ม ปาล์มที่เข้าใจผิดคิดว่าเธอโกรธนั้นขอโทษเธอและพยายามรับผิดชอบทุกวิถีทาง แต่อายนั้นไม่ได้โกรธเลย ปาล์มตกลงเรื่องอนาคตกับอาย อายเข้าใจและยอมรับ", "17 ตุลาคม - หลังเที่ยงคืนของวันที่ 16 ตุลาคม ทั้งคู่ออกไปเดินเล่นกันระหว่างเดินทางก ะเริ่มใช้ธาตุ ดิน น้ำ ลม ไฟ ได้ครบ กรกับแพรเริ่มมีใจให้กัน", "\t- เกิดสงครามกับราชาแห่งเทือกเขามรณะ (ผีปอบ) กรได้รู้ความจริงว่าราชาคือพ่อแท้ๆ ของตน ที่ถูกอสูรอัมพิกาบังคับให้ฆ่าคนเพื่อเอาวิญญาณ กรสู้จนราชาสิ้นใจ วิญญาณนับหมื่นได้รับการปลดปล่อย และกรเลือกใช้ชีวิตอยู่กับแพรในโลกหิมพานต์", "## PEETORDER : ฮีโร่ไม่จำเป็นต้องมีพลังวิเศษ", "ปี พ.ศ. 2571 (ค.ศ. 2028)", "\t- พีท นักมวยใต้ดินที่ยอมล้มมวยเพื่อเงิน เริ่มฝึกฝนตัวเองอย่างจริงจังตามคำสอนของแม็ก", "\t- ฟางติดหนี้เสี่ยชาตรี 1,000,000 บาท พีทจึงลงสังเวียนเพื่อปลดหนี้ให้ฟาง", "\t- พีทชนะ พล IRONMEN อดีตแชมป์มวยไทย และชนะ ไมเคิล มฤตยูดำ เสี่ยชาตรียกหนี้ให้ฟางพร้อมมอบรางวัล 10,000,000 บาท พีทกับฟางนำเงินไปบริจาคให้บ้านเด็กกำพร้า และทั้งคู่ได้เป็นคนรักกัน", "\t- CODE2 และบัวบานเห็นคลิปการต่อสู้ของพีท", "## BIRD ROCK การปฎิวัติ", "ปี พ.ศ. 2571 (ค.ศ. 2028)", "\t- เบิร์ด ช่างซ่อมเครื่องใช้ไฟฟ้าที่แม่ป่วยหนักและต้องใช้เงิน 1,000,000 บาท กู้เงินจากแป๊ะปาไลยก์มาเปิดร้าน แต่ร้านถูกแก๊งฮาคิยิงถล่ม", "\t- เบิร์ดนำปืนของพ่อออกมา และยิงสมาชิกแก๊งฮาคิที่รุมทำร้ายคนแก่กลางตลาดจนถูกตำรวจจับ", "\t- ชายลึกลับถือมีดบุกเข้ามาช่วยเบิร์ดออกจากห้องขัง ฝูงชนลุกฮือจลาจลตะโกนคำว่า \"ปฏิวัติ\" กลายเป็นจุดกำเนิดของ BIRD ROCK ผู้นำกลุ่มปฏิวัติแห่งภาคใต้", "\t- CODE2 และบัวบานเห็นข่าวการปฏิวัติที่ไชยา และเชื่อว่า PALMER46 อยู่ที่นั่น", "## PAE PA LAI 2 : สงครามแก๊งแห่งไชยา", "ปี พ.ศ. 2572 (ค.ศ. 2029)", "\t- บิ๊กป้อมวางมือจากโลกแก๊งเพราะภรรยาตั้งท้อง", "\t- แก๊งฮาคิร่วมมือกับแก๊งสองบิ้งรุกล้ำเขตของปาลิไลยก์ บอสฮาคิส่งคำขู่ให้ยุบแก๊ง แป๊ะปาไลยก์จึงประกาศสงคราม", "\t- เกิดสงครามแก๊ง แป๊ะถูกยิงหลายนัด กองกำลังของบิ๊กป้อม (แก๊งหรุม) มาช่วยไว้ แป๊ะยิงบอสฮาคิตาย แก๊งฮาคิและแก๊งสองบิ้งถูกทำลาย แก๊งหรุมรวมเข้ากับปาลิไลยก์ ทำให้ปาลิไลยก์ครองเมืองไชยาทั้งหมด", "\t- BIRD ROCK สั่งให้ PALMER46 สังหารนายกรัฐมนตรีที่จะลงพื้นที่สุราษฎร์ธานี และต้องการลบล้างแก๊งปาลิไลยก์", "## KORN 2 : การมาของปีศาจ", "ปี พ.ศ. 2572 (ค.ศ. 2029)", "\t- กรมีชื่อเสียงจากการปราบราชาแห่งเทือกเขามรณะ จึงถูกเชิญเข้าร่วมสงครามใหญ่ของโลกหิมพานต์ สงครามจบลงด้วยอาณาจักรศรีวิชัยคืนเอกราชให้ทุกอาณาจักร", "\t- กรออกตามหาความจริงเรื่องการล่มสลายของกรุงศรีอโยธยา และพบว่าเมืองบาดาลของนาคราชถูกอสูรอัมพิกาทำลาย", "\t- กรและแพรต่อสู้กับอสูรอัมพิกาและอสูรอัปสราในป่าแห่งความตาย ทั้งสองอสูรถูกปลดปล่อยจากคำสาปของอัสโมดัสและได้ไปสวรรค์", "\t- ท้าวมาราธิราช (พญามาร) บนสวรรค์ชั้นปรนิมมิตวสวัตดี เริ่มวางแผนกวาดล้างมนุษย์", "## PEETORDER 2 : กับฆาตกรผู้โหดเหี้ยม", "ปี พ.ศ. 2572 (ค.ศ. 2029)", "\t- เด็กหญิงที่เคยให้อาหาร PALMER46 ถูกรถของอันธพาลชนเสียชีวิต และตำรวจช่วยปิดคดี PALMER46 จึงสังหารพวกอันธพาลและตำรวจทั้งหมด", "\t- CODE2 และบัวบานมาหา PEETORDER ที่ไชยา เพื่อเตือนว่า PALMER46 (ค่าหัว 30,000,000 บาท) อาจร่วมมือกับ BIRD ROCK และมีแผนสังหารนายกรัฐมนตรีที่บ้านดอน", "\t- PALMER46 ระเบิดเมืองสุราษฎร์ธานี PEETORDER สู้ตัวต่อตัวแต่แพ้ยับเยิน CODE2 ถ่วงเวลาไว้ได้เพราะ PALMER46 ไม่ยอมทำร้ายครอบครัวคนสุดท้ายของเขา", "\t- PEETORDER และบัวบานไปฝึกกับครูมวยไชยาคนสุดท้าย แล้วทั้งสามคนร่วมกันสู้ PALMER46 ที่บ้านดอน PEETORDER ชนะแต่ยอมปล่อยเขาไป", "\t- CODE2 และบัวบานแอบทำแผลให้ PALMER46 และนำมีดคารัมบิตกับเศษหน้ากากคืนให้เขา", "## PAE PA LAI 3 : การรุกรานของ BIRD ROCK", "ปี พ.ศ. 2572 (ค.ศ. 2029)", "\t- ปาลิไลยก์จัดงานฉลองการครองเมืองไชยา PALMER46 ปรากฏตัวต่อหน้าแป๊ะในงานแล้วหายไป", "\t- กองทัพ BIRD ROCK นับหมื่นคนบุกมาตามทางรถไฟ โดยมี PALMER46 อยู่ฝ่าย BIRD ROCK รถบรรทุกระเบิดพุ่งชนฐานของปาลิไลยก์", "\t- นายถูกยิง มอสบาดเจ็บสาหัส แป๊ะปาไลยก์สู้จนตัวตาย แก๊งปาลิไลยก์ล่มสลาย", "\t- PALMER46 ช่วยม้าขาวจากคนของ BIRD ROCK และพาไปด้วย", "## BIRD ROCK 2 : สู่สงครามครั้งใหญ่", "ปี พ.ศ. 2572 (ค.ศ. 2029)", "\t- BIRD ROCK กวาดล้างคนเลวในไชยาและปกครองด้วยความหวาดกลัว ก่อนขยายอำนาจยึดหลายจังหวัดในภาคใต้ โดยใช้ภูเก็ตเป็นฐาน", "\t- กองทัพไทยรัฐประหารนายกรัฐมนตรีเพื่อใช้อาวุธหนักปราบ BIRD ROCK สงขลาเป็นสมรภูมิที่รบหนักที่สุด", "\t- นายน้อยที่รอดชีวิตถูกดึงมาเป็นนักวางแผนให้ BIRD ROCK แผนลวงของนายน้อยพลิกสถานการณ์จนชนะ", "\t- รัฐบาลขอเจรจาหยุดยิง และยอมให้ BIRD ROCK ปกครองภาคใต้ เบิร์ดกับยาได้เป็นคนรักกัน", "\t- PALMER46 ใช้ชีวิตอย่างอิสระในเขตของ BIRD ROCK กับม้าขาว", "## ความโหดร้ายของสมรภูมิ", "ปี พ.ศ. 2572 (ค.ศ. 2029)", "\t- บอยผ่านการฝึกหน่วยรบพิเศษและ Hell Week ที่มีผู้ผ่านเพียง 20 จาก 60 นาย", "\t- ทีมของบอย มาส จอน และกัน ได้รับภารกิจลอบสังหารหัวหน้า BIRD ROCK แต่ไม่พบตัว และถูกกองกำลัง BIRD ROCK ไล่ล่าในป่า", "\t- มาส จอน และกัน เสียชีวิต บอยรอดชีวิตมาได้ด้วยการโจมตีทางอากาศ หลังพิธีศพของเพื่อนทั้งสาม บอยแต่งงานกับปราง", "## KORN 3 : ทะยานสู่ด้านมืด", "ปี พ.ศ. 2573 (ค.ศ. 2030)", "\t- กรและแพรออกตามหาคาถาเปิดประตูกลับโลกมนุษย์ ซาตานกระซิบบอกกรว่าแม่ของกรเสียชีวิตแล้วจากสงครามในโลกมนุษย์", "\t- ท้าวมาราธิราชยกทัพปีศาจนับล้านล้างบางมนุษย์ และยื่นข้อเสนอว่าจะถอยทัพถ้าแพรตาย แพรถูกพญานาคสังหาร", "\t- กรคลั่ง รับพลังจากซาตานกลายเป็นมาร ดูดวิญญาณนับล้าน และสลายท้าวมาราธิราช", "\t- กรกลับมายังโลกมนุษย์ ปะทะกับ PALMER46 ในบ้านร้างแล้วหนีไป มายาเริ่มฝันร้าย", "## PEETORDER 3 : ฉัน คือ ฮีโร่", "ปี พ.ศ. 2573 (ค.ศ. 2030)", "\t- มายาติดต่อวิญญาณและรู้ว่าจะเกิดหายนะ จึงไปขอความช่วยเหลือจากพีทและ PALMER46", "\t- กรประกาศว่าในวันสุริยุปราคา ประตูจากอีกโลกจะเปิดเพื่อกวาดล้างมนุษย์ พีท มายา และ PALMER46 ร่วมกันสู้กับกร มายายอมรับเงื่อนไขของอัสโมดัสเพื่อแลกกับพลัง", "\t- ในวันสุริยุปราคาเต็มดวง พีทฝ่าพลังมืดเข้าไปและเสียสละชีวิตจนร่างของกรแตกสลาย PEETORDER เสียชีวิต", "\t- มายาแจ้งข่าวให้ฟางและจัดงานศพให้พีท กรได้พบกับแพรอีกครั้งในโลกหลังความตาย", "## PALMER46 : VIRUS", "ปี พ.ศ. 2578 (ค.ศ. 2035)", "\t- ประเทศพังทลายจากสงคราม BIRD ROCK ผู้คนหลายล้านอดอยาก ปาล์มยังคงใช้ชีวิตที่ไชยา", "\t- มอสชวนปาล์มปล้น BioLink นาโนชิปเชื่อมสมองของ KITTITECH (ที่ผู้ใช้จะเสียชีวิต) โดยร่วมมือกับออกญา ขณะที่หน่วยข่าวกรองต่างชาติก็ตามล่า BioLink เช่นกัน", "\t- PALMER46 บุกตึก KITTITECH แต่เลือกพาตัว ดร.ฝน ผู้สร้าง BioLink ที่ถูกกักตัวไว้ออกมาแทน และไลฟ์สดประกาศว่าใครยุ่งกับเธอจะต้องตาย", "\t- ทั้งคู่ต้องหนีหลายร้อยกิโลเมตรลงใต้สู่เขตของ BIRD ROCK CODE2 แอบมาเฝ้าปาล์มหนึ่งคืน", "## PALMER46 : เพื่อเธอที่ฉันรัก", "ปี พ.ศ. 2578 (ค.ศ. 2035)", "\t- ปาล์มและฝนหนีไปตามชายหาด ถูกนักล่าค่าหัวไล่ล่าไม่หยุด ทั้งกัส นินจา 5 คน ริว หมอเปรม และตระกูลแบล็คธอร์น", "\t- ปาล์มชนะโรนันแห่งตระกูลแบล็คธอร์น ฝนขอให้ไว้ชีวิต และทั้งสองได้เปิดใจรักกัน", "\t- ใกล้ชายแดน BIRD ROCK ปาล์มบาดเจ็บหนักจากนักล่าค่าหัวนับสิบ ฝนวิ่งไปขอความช่วยเหลือจาก BIRD ROCK จนรอดมาได้", "\t- ปาล์มและฝนแต่งงานกันแบบไทยในเขตของ BIRD ROCK และใช้ชีวิตคู่ด้วยกัน", "\t- โปร CEO ของ KITTITECH พัฒนาอาวุธ TOY V.K, ปืน K Xenon-1 และรถถังเรลกัน KTR-1 เพื่อเอาชนะ BIRD ROCK", "## BIRD ROCK 3 : สงครามครั้งสุดท้าย", "ปี พ.ศ. 2580 (ค.ศ. 2037)", "\t- BIRD ROCK ประหารนักโทษที่ทำผิดซ้ำ ยาไม่เห็นด้วยและแอบสร้างกองกำลังต่อต้าน นายน้อยลาออกเพราะไม่เห็นด้วยกับแผนยึดกรุงเทพฯ", "\t- BIRD ROCK ยกทัพยึดประจวบคีรีขันธ์ เพชรบุรี และสมุทรสาคร", "\t- รัฐบาลร่วมมือกับ KITTITECH ส่งรถถังเรลกัน KTR-1 เข้าโจมตี BIRD ROCK พ่ายแพ้ ตึกบัญชาการถูกถล่ม เบิร์ดและยาเสียชีวิต ภาคใต้กลับคืนสู่ประเทศไทย", "## PALMER46 : END CODE", "ปี พ.ศ. 2581 (ค.ศ. 2038)", "\t- ปาล์มและฝนใช้ชีวิตอย่างมีความสุขที่สุราษฎร์ธานี และฝนเริ่มตั้งท้อง", "\t- โปรหลอกเสนอลบค่าหัวแลกกับ BioLink แต่แท้จริงต้องการตัวฝน บ้านถูกบุกและฝนถูกจับตัวไป", "\t- ปาล์มใช้ BioLink ทั้งที่รู้ว่าจะต้องตาย ควบคุมโดรนทหารนับพัน ทำลาย TOY V.K และกองทัพ KITTITECH แล้วสังหารโปร", "\t- PALMER46 ถูกยิงเสียชีวิต ค่าหัวของฝนถูกยกเลิก และ BioLink ถูกแบนทั่วโลก", "\t- หลายเดือนต่อมา ฝนใช้ชีวิตในบ้านริมชายหาดตามที่ปาล์มเคยสัญญาไว้ พร้อมลูกในท้อง", "## บัวบาน : สตรีแห่งสังเวียนเดือด", "ปี พ.ศ. 2582 (ค.ศ. 2039)", "\t- คุณยายของบัวบานป่วยหนัก บัวบานต้องหาเงินค่ารักษา ซีจึงให้ตั๋วเข้าสู่ The Bloom สังเวียนใต้ดินไร้กติกาของเสี่ยชาตรี", "\t- บัวบานฝึกกับพล (มนุษย์เหล็ก) ตามตารางฝึกที่ PEETORDER เคยวางไว้", "\t- รอบชิงชนะเลิศ บัวบานชนะ ไทโรน เดอะ วอลล์ แชมป์ไร้พ่าย ด้วยมวยไชยา คว้าเงินรางวัล 10,000,000 บาท และกลายเป็นไวรัลทั่วโลก", "\t- คุณยายเสียชีวิตก่อนที่บัวบานจะกลับไปถึง บัวบานรู้ว่าซีแอบจ่ายค่ารักษาให้มาตลอด และทั้งสองคืนดีกัน", "## CODE2 : ปฏิบัติการพันธุ์สวยสังหาร", "ปี พ.ศ. 2582 (ค.ศ. 2039)", "\t- บอส CEO Ratcha จ้าง CODE2 ขโมย \"วงจรชะตาแห่งอดีต\" จากงานประมูลของ Kittitech ที่นำของของ PALMER46 มาประมูลด้วย", "\t- ซีเป็นเพื่อนกับยามิ นักฆ่าญี่ปุ่นผู้ถือดาบซากุระโนะคิบะ", "\t- ตระกูลแบล็คธอร์นมาแก้แค้นที่ PALMER46 ฆ่าโรนัน ยามิทรยศตระกูลเพื่อปกป้องซีจนเสียชีวิต และมอบดาบให้ซี", "\t- ซีใช้ท่า \"เงาซากุระร่ายรำ\" สังหารเดรโก นักฆ่าที่แกร่งที่สุดของตระกูล แล้วได้ฮูด หน้ากาก และมีดของ PALMER46 คืนมา", "## CODE2 : ความทรงจำในวันที่อำลา", "ปี พ.ศ. 2582 (ค.ศ. 2039)", "\t- ซีเดินทางไปบ้านริมหาดของฝนที่ภูเก็ต เพื่อมอบฮูดและหน้ากากของปาล์ม ฝนกำลังเลี้ยงลูกแฝดของปาล์ม และรับซีเป็นน้องสาว", "\t- CODE2 ล่าคนเลวในภูเก็ตจนเกินเส้น บัวบานมาจากกรุงเทพฯ เพื่อหยุดเธอ ทั้งคู่สู้กันก่อนที่ซีจะคิดได้", "\t- ศักดิ์ตามาร มือขวาของ สจ.ภู ผู้แค้น PALMER46 ที่ฆ่าน้องชายของเขา บุกบ้าน ทำร้ายบัวบาน และจับตัวฝนไป", "\t- CODE2 ใช้ \"เงาซากุระร่ายรำ\" สังหารศักดิ์ตามารและช่วยฝนไว้ได้ทันเวลา", "\t- เกิด \"ลัทธิ CODE2\" ที่ช่วยดูแลภูเก็ตแทน ซีและบัวบานเดินทางกลับกรุงเทพฯ", "## TOY : รักและความทรงจำ", "ปี พ.ศ. 2582 (ค.ศ. 2039)", "\t- หลังโปรตาย เท็นขึ้นเป็น CEO รุ่นที่ 2 ของ Kittitech และใช้ทอยทำภารกิจ ทอยได้พบรักกับไทม์ ชายธรรมดาที่ใจดีกับเธอ", "\t- Kittitech สร้าง Project DeepBlue อาวุธพลังงานยูเรเนียม ไทม์ซึ่งเป็นสายลับนำกองกำลังของ Ratcha บุก Kittitech", "\t- เท็นสั่งให้ทอยฆ่าไทม์ ไทม์เสียชีวิต ทอยเป็นอิสระจากชิปควบคุม แล้วพาเท็นพุ่งเข้าแกนพลังงาน DeepBlue จนระเบิด ตึก Kittitech ถล่ม", "\t- ทอยในสภาพร่างพังมาหาฝนเพื่อซ่อมหน่วยความจำ ฝนให้ทอยอยู่ด้วยและเรียกเธอว่า \"พี่สาว\"", "## ออกญา : กุหลาบมรณะ", "ปี พ.ศ. 2582 (ค.ศ. 2039)", "\t- ออกญาเจรจากับจนิน เจ้าพ่อค้ายาเสพติดและค้ามนุษย์จากปอยเปต ที่รุกล้ำถิ่นของเธอ แต่ถูกหักหลังและจับตัวไปทรมาน", "\t- ออกญาหนีออกจากปอยเปตโดยมีคนช่วยซ่อนตัว และข้ามชายแดนกลับมาได้", "\t- ออกญาแก้แค้นด้วยการระเบิดคาสิโนในเครือของจนินทั่วปอยเปตพร้อมกัน และจับตัวจนินโยนลงจากตึก", "## มายา : ศึก 3 ธิดามาร", "ปี พ.ศ. 2582 (ค.ศ. 2039)", "\t- มายา ทนายความผู้มีพลังปีศาจจากสัญญากับอัสโมดัส ได้พบรักกับตะวัน ชายหนุ่มขี้อาย", "\t- 3 ธิดามาร (ตัณหา อรดี ราคา) ตามหา \"ศิลาแห่งชะตา\" ซึ่งมายาถือชิ้น \"ปัจจุบัน\" ไว้ และเกิดศึกที่หมู่บ้านในอินเดีย", "\t- ตะวันขอเบลเซบับคืนชีพมายาแลกกับชีวิตตน ทั้งคู่รอด แต่ตะวันลืมมายาไปทั้งหมด", "\t- 3 เดือนต่อมาในกรุงเทพฯ ตะวันเดินสวนกับมายา แล้วหันมาถามว่า \"พวกเราเคยรู้จักกันไหม\"", "## ม้าขาว : อารัมภบทกัลยา", "ปี พ.ศ. 2583 (ค.ศ. 2040)", "\t- อิลลูมินาติ (เคนเนดี้ นีร์วานา มิแรนด้า) บุก Ratcha ปล้น \"ศิลาแห่งชะตาแห่งอดีต\" และบังคับมอสให้ช่วยหาอีก 2 ชิ้น", "\t- มอสและฝนเปิดคอมพิวเตอร์ของปาล์ม พบไฟล์ \"รายชื่อกัลยา.bat\" รายชื่อ 5 คนที่ปาล์มเชื่อว่าช่วยได้ คือ TOY บัวบาน CODE2 มายา และออกญา", "\t- มอสรวบรวมทั้ง 5 คน เกิดเป็น \"คณะกัลยา\" ปกป้องศิลาชะตาแห่งปัจจุบันจากนีร์วานา และชนะอัญชันกับมิแรนด้า", "\t- เคนเนดี้ส่งทีม \"บุษบาทมิฬ\" มาจัดการคณะกัลยา", "## ปฐมกาลบุษบาทมิฬ", "ปี พ.ศ. 2546 (ค.ศ. 2003)", "\t12 เมษายน - ทราย (ลีลาวดีเพลิง) ถือกำเนิด แม่เสียชีวิตตอนคลอด", "ปี พ.ศ. 2549 (ค.ศ. 2006)", "\t14 มกราคม - มะลิราตรีถือกำเนิด", "ปี พ.ศ. 2553 (ค.ศ. 2010)", "\t12 พฤษภาคม - โรส (กุหลาบดำ) ถือกำเนิด", "ปี พ.ศ. 2562 (ค.ศ. 2019)", "\t- พ่อเลี้ยงของมะลิฆ่าแม่ของเธอ มะลิฆ่าพ่อเลี้ยงและถูกส่งไปขังในโรงพยาบาลจิตเวช", "\t- ทรายคว้าแชมป์มวยไทยระดับภาค", "ปี พ.ศ. 2563 (ค.ศ. 2020)", "\t- ทรายคว้าแชมป์ประเทศไทยมวยหญิง", "ปี พ.ศ. 2564 (ค.ศ. 2021)", "\t- ทรายคว้าแชมป์โลกมวยไทยหญิง และพ่อของเธอเสียชีวิต", "ปี พ.ศ. 2565 (ค.ศ. 2022)", "\t- มะลิฆ่าผู้ชายทั้งโรงพยาบาลจิตเวช และถูกอิลลูมินาติพาตัวไปฝึกเป็นนักฆ่า", "\t- ทรายคว้าแชมป์โลกมวยสากลหญิง", "\t12 พฤษภาคม - แม่ของโรสถูกฆ่า โรสถูกแก๊งค้ามนุษย์จับตัว และรับพลังมืดจากอัสโมดัส", "ปี พ.ศ. 2566 (ค.ศ. 2023)", "\t- ทรายคว้าแชมป์โลก MMA ก่อนเผลอฆ่าคนตาย และถูกเคนเนดี้ชวนเข้าบุษบาทมิฬ", "ปี พ.ศ. 2567 (ค.ศ. 2024)", "\t- โรสใช้ชีวิตเป็นโสเภณี ก่อนที่นีร์วานาจะชวนเข้าบุษบาทมิฬ", "ก่อนปี พ.ศ. 2568 (ค.ศ. 2025)", "\t- ใบบัวถูกสามีฆ่าเพื่อเงิน ดร.พลอย นำร่างมาสร้างเป็นไซบอร์ก \"ดอกบัวเหล็ก\" และยูนิโกะเข้าร่วมเป็น \"อัญชันมรณะ\" ทีมบุษบาทมิฬครบ 5 คน", "ปี พ.ศ. 2568 (ค.ศ. 2025)", "\t18 พฤศจิกายน - บุษบาทมิฬสังหารรัฐมนตรีที่ไม่ทำตามคำสั่งของอิลลูมินาติ", "\t19 พฤศจิกายน - บุษบาทมิฬได้รับคำสั่งปกป้องห้องทดลองของ ดร.พลอย จาก PALMER46", "\t20 พฤศจิกายน - PALMER46 บุกฐานใต้ดินของอิลลูมินาติ ชนะบุษบาทมิฬทั้ง 5 คนโดยไม่ฆ่า เคนเนดี้ยื่นข้อตกลงเพื่อให้ PALMER46 เลิกยุ่งกับอิลลูมินาติ", "## คณะกัลยา : บุษบาทมิฬ", "ปี พ.ศ. 2583 (ค.ศ. 2040)", "\t- ศิลาแห่งชะตาทั้ง 3 ชิ้น: อดีตอยู่กับเคนเนดี้ ปัจจุบันอยู่กับคณะกัลยา ส่วนอนาคตยังไม่มีใครรู้", "\t- บุษบาทมิฬขู่จะระเบิดเขื่อนที่อำเภอบ้านตาขุน เพื่อแลกกับศิลาชะตาแห่งปัจจุบัน", "\t- ศึกตัวต่อตัว: บัวบาน ปะทะ ลีลาวดีเพลิง, มายา ปะทะ กุหลาบดำ, TOY ปะทะ ดอกบัวเหล็ก, ออกญา ปะทะ อัญชันมรณะ และ CODE2 ปะทะ มะลิราตรี", "\t- คณะกัลยาชนะโดยไม่มีใครเสียชีวิต บุษบาทมิฬยอมแพ้ เคนเนดี้สั่ง ดร.พลอย เตรียม Paragon Legion", "## คณะกัลยา 2 : Paragon Legion", "ปี พ.ศ. 2583 (ค.ศ. 2040)", "\t- ดร.พลอย สร้าง Paragon Legion มนุษย์สมบูรณ์แบบจากพันธุกรรม 32 คน (อายุจริงเพียง 15 ปี)", "\t- Paragon Legion บุกถล่มคณะกัลยา บัวบานบาดเจ็บสาหัส คณะกัลยาพ่ายแพ้และถูกขังในคุกที่จูน รองหัวหน้า FIB ควบคุม ขณะที่ Paragon แยกกันทำลายล้างหลายเมือง", "\t- Paragon 2 ทรยศพี่น้องเพื่อหยุดการสังหาร คณะกัลยาฝึกฝนและกลับมาเอาชนะ Paragon Legion ได้ โดยเคนเนดี้แอบให้ข้อมูลเพราะไม่เห็นด้วยกับแผนของเฮนรี่", "\t- คณะกัลยาพบ Paragon รุ่นที่ 2 จำนวน 666 คน ซึ่งเป็นลูกทางพันธุกรรมของ CODE2 ออกญารับเลี้ยงไว้ และคณะกัลยาตัดสินใจบุกฐานใหญ่ของหัวหน้าสูงสุดอิลลูมินาติ", "## คณะกัลยา 3 : มหาภัยอิลลูมินาติ", "ปี พ.ศ. 2583 (ค.ศ. 2040)", "\t- บุษบาทมิฬกลายเป็นพันธมิตร หลังเคนเนดี้ยกเลิกแผนและเปิดเผยข้อมูลฐานใหญ่ของอิลลูมินาติ ลีลาวดีเพลิงมอบ Demon Serum ให้บัวบาน", "\t- คณะกัลยาบุกฐานใหญ่ของอิลลูมินาติที่บาวาเรีย ประเทศเยอรมนี เผชิญผู้พิทักษ์ของเฮนรี่ ได้แก่ แจ็กเดอะริปเปอร์ ซาโตชิ นากาโมโตะ เฉินลี เมอร์ลิน และรัสปูติน", "\t- มายาสู้กับเมอร์ลินจนเมอร์ลินตาย ซาโตชิลาออก บัวบานและมายาเสียสละตัวเอง บัวบานอาการวิกฤตที่โรงพยาบาลในเยอรมนี", "\t- CODE2 ถูกจับและยอมมอบศิลาชะตาแห่งอดีตเพื่อแลกให้เลิกไล่ล่า ส่วนศิลาปัจจุบันยังอยู่กับ TOY", "\t- เฮนรี่ครอบครองศิลาแห่งอดีตและอนาคต เห็นอนาคต และตั้งเป้าหมายสู่ \"ยุคแห่งเมต้าฮิวแมน\"", "## คณะกัลยา 4 : ชะตาแห่งปาฏิหาริย์", "ปี พ.ศ. 2583 (ค.ศ. 2040)", "\t- CODE2 ถูกพอลทรมานนาน 1 เดือน ก่อนมิแรนด้าเข้าช่วยเหลือ มายาไปอยู่นรกขุมที่ 5 กลายเป็นราชินีปีศาจ นีร์วานาไปช่วยพากลับมา", "\t- เฮนรี่เริ่มแผน \"อเวคเคนนิ่ง\" หุ่นยนต์ยักษ์สูง 50 เมตรโผล่ขึ้นทั่วโลก มิแรนด้านำ Paragon 31 คนมาช่วยคณะกัลยา", "\t- เฮนรี่ได้ศิลาแห่งชะตาครบ 3 ชิ้น คลื่นสีทองแผ่ไปทั่วโลก เริ่มต้น \"ยุคแห่งเมต้าฮิวแมน\" เฮนรี่วิวัฒนาการเป็นร่างแมลงและขู่จะฆ่าฝน", "\t- คณะกัลยาใช้พลังไฟฟ้ามหาศาลโจมตีครั้งเดียวสังหารเฮนรี่ ทั่วโลกร่วมกันสู้หุ่นยักษ์ และเมต้าฮิวแมนเริ่มค้นพบพลังของตัวเอง", "\t- นีร์วานาเผาซากของเฮนรี่ เคนเนดี้ขึ้นเป็นหัวหน้าสูงสุดของอิลลูมินาติ และอากรัท บัท มาห์ลัต บุกมาบังคับให้ปล่อยให้ยุคใหม่ดำเนินต่อไป", "## [L3.11.2] บลูลัสท์ ราคะผจญ", "ปี พ.ศ. 2568 (ค.ศ. 2025)", "\t1 พฤศจิกายน - ปาล์มยังทำงานเป็น PALMER46 ให้แคร์และอาศัยอยู่ในคฤหาสน์กับแคร์ เจน และซี คืนนี้ความสัมพันธ์ลับระหว่างปาล์มกับแคร์เริ่มต้นขึ้น", "\t7 พฤศจิกายน - TOY มาขอบคุณ PALMER46 ที่ปลดปล่อยเธอ และบอกว่ากำลังจะไปอยู่กับบริษัท Kittitech", "\t8 พฤศจิกายน - อากรัท บัท มาห์ลัต (มารดาของอัสโมดัส) ผูกสัญญากับปาล์มผ่านความฝัน ทำให้เธอใช้เงาของปาล์มข้ามมิติจากนรกขุมที่ 2 มายังโลกมนุษย์ และเร่งพลังราคะของเขา", "\t10 พฤศจิกายน - อากรัทปรากฏตัวออกมาจากเงาของปาล์มต่อหน้าเขากับฟ้าเป็นครั้งแรก", "\t11 พฤศจิกายน - PALMER46 พบเคนเนดี้แห่งอิลลูมินาติ ซึ่งพาเขาไปยังฐานวิจัยใต้ดินที่มีโครงการลับ", "\t12 พฤศจิกายน - PALMER46 แพ้การต่อรองกับเคนเนดี้และมิแรนด้า จึงต้องยอมทำตามเงื่อนไขของอิลลูมินาติ", "\t13 พฤศจิกายน - เคนเนดี้เปิดเผยโครงการ Paragon Legion ที่ใช้พันธุกรรมของ PALMER46 กับนักฆ่าหญิง 32 คน (หนึ่งในนั้นคือยามิ) จนครบ 32 คนในวันที่ 14", "\t14 พฤศจิกายน - อากรัทมาพบเคนเนดี้และเสนอให้สร้าง Paragon Legion Gen 2 จำนวน 666 คนจากพันธุกรรมของ CODE2", "\t15 พฤศจิกายน - PALMER46 หายจากบ้านไป 4 วัน เขาปิดบังความจริงเรื่อง Gen 2 จาก CODE2 เพื่อปกป้องทุกคนจากอิลลูมินาติ", "\t19 พฤศจิกายน - ปาล์มกลับบ้านในสภาพหมดสติ ก่อนไปปะทะกับบุษบาทมิฬในคืนวันที่ 20 (เหตุการณ์เดียวกับในปฐมกาลบุษบาทมิฬ) หลังจากนั้นอากรัทลบความทรงจำบางส่วนของบุษบาทมิฬตามคำขอของเคนเนดี้", "\t20 พฤศจิกายน - โครงการ Paragon Legion รุ่น Chimera เริ่มขึ้น The Final Paragon ลูกคนที่ 2 ของเคนเนดี้กับ PALMER46 ถือกำเนิด PALMER46 ได้อิสระจากอิลลูมินาติ แต่ยังติดคำสาปของอากรัท", "\t21 พฤศจิกายน - อากรัทก่อตั้ง Midn
